<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NightBurger Menu — Burgers &amp; Sides</title>
  <meta name="description" content="The full NightBurger menu: signature burgers, loaded sides and cold drinks, built for nights that start late. Filter by category and order in one tap." />
  <link rel="canonical" href="https://nightburger.example/menu.html" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="NightBurger Menu — Burgers &amp; Sides" />
  <meta property="og:description" content="Signature burgers, loaded sides and cold drinks for nights that start late." />
  <meta property="og:image" content="assets/images/social/og-cover.svg" />
  <meta property="og:url" content="https://nightburger.example/menu.html" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="assets/images/logo/favicon.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/reset.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/pages.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
</head>

<body data-page="menu">
  <div data-component="header"></div>

  <main id="main">
    <section class="page-hero" aria-labelledby="menu-title">
      <div class="container container--narrow">
        <p class="page-hero__eyebrow">Le menu</p>
        <h1 class="page-hero__title" id="menu-title">Le menu</h1>
        <p class="page-hero__lead">Des burgers pour les nuits qui commencent tard, avec les accompagnements et boissons qui vont avec.</p>
      </div>
    </section>

    <section class="section" aria-label="Menu products">
      <div class="container">
        <div class="menu-filters" role="group" aria-label="Filter menu by category">
          <button class="menu-filter" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="menu-filter" type="button" data-filter="burgers" aria-pressed="false">Burgers</button>
          <button class="menu-filter" type="button" data-filter="sides" aria-pressed="false">Sides</button>
          <button class="menu-filter" type="button" data-filter="drinks" aria-pressed="false">Drinks</button>
        </div>

        <div id="menu-root"></div>
      </div>
    </section>

    <section class="section final-cta" aria-labelledby="menu-cta-title">
      <div class="container">
        <div class="final-cta__panel reveal">
          <h2 class="final-cta__title" id="menu-cta-title">Vous avez fait votre choix ?</h2>
          <p class="final-cta__text">Envoyez votre commande et nous allumons le grill.</p>
          <a class="btn btn--primary btn--lg" data-order-link href="#">
            <span>Commander maintenant</span>
            <span class="icon icon--arrow-right" aria-hidden="true"></span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <div data-component="footer"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/navigation.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
