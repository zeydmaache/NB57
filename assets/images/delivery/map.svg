<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="Stylised night map of the NightBurger delivery area">
  <defs>
    <linearGradient id="mn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF2DA6"/><stop offset="1" stop-color="#216CFF"/>
    </linearGradient>
    <radialGradient id="mg" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#8B3DFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B3DFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="560" height="460" fill="#0B0A1C"/>
  <rect width="560" height="460" fill="url(#mg)"/>

  <!-- roads -->
  <g stroke="#24243C" stroke-width="10" fill="none" stroke-linecap="round">
    <path d="M40 120 H520"/><path d="M40 250 H520"/><path d="M40 370 H520"/>
    <path d="M150 40 V430"/><path d="M300 40 V430"/><path d="M430 40 V430"/>
    <path d="M60 60 L300 250 L520 300"/>
  </g>
  <g stroke="url(#mn)" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M40 250 H520"/><path d="M300 40 V430"/>
  </g>

  <!-- delivery radius -->
  <circle cx="290" cy="235" r="150" fill="none" stroke="url(#mn)" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.8"/>

  <!-- zone pins -->
  <g fill="#2CE59B">
    <circle cx="290" cy="235" r="6"/><circle cx="200" cy="160" r="6"/><circle cx="380" cy="180" r="6"/>
    <circle cx="240" cy="320" r="6"/><circle cx="360" cy="300" r="6"/><circle cx="150" cy="250" r="6"/>
  </g>
  <g fill="#FF7A18">
    <circle cx="450" cy="330" r="6"/><circle cx="430" cy="120" r="6"/>
  </g>

  <!-- hub -->
  <circle cx="290" cy="235" r="12" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <text x="24" y="440" fill="#858596" font-family="Inter,system-ui,sans-serif" font-size="11" letter-spacing="1.5">MAP PLACEHOLDER · assets/images/delivery/</text>
</svg>
