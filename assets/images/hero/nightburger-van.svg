<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of the NightBurger delivery van glowing with neon on a night city street">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05030F"/>
      <stop offset="0.55" stop-color="#0C0A24"/>
      <stop offset="1" stop-color="#1A0B33"/>
    </linearGradient>
    <linearGradient id="street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140F2B"/>
      <stop offset="1" stop-color="#060411"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2DA6"/>
      <stop offset="0.5" stop-color="#8B3DFF"/>
      <stop offset="1" stop-color="#216CFF"/>
    </linearGradient>
    <linearGradient id="van" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20203A"/>
      <stop offset="1" stop-color="#12121F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF2DA6" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#8B3DFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8B3DFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <ellipse cx="400" cy="430" rx="360" ry="220" fill="url(#glow)"/>

  <!-- Stars -->
  <g fill="#FFFFFF">
    <circle cx="90" cy="70" r="1.6" opacity="0.9"/>
    <circle cx="180" cy="120" r="1.1" opacity="0.6"/>
    <circle cx="300" cy="60" r="1.4" opacity="0.8"/>
    <circle cx="520" cy="90" r="1.2" opacity="0.7"/>
    <circle cx="640" cy="50" r="1.7" opacity="0.9"/>
    <circle cx="720" cy="140" r="1.1" opacity="0.6"/>
    <circle cx="430" cy="140" r="1" opacity="0.5"/>
    <circle cx="60" cy="200" r="1" opacity="0.5"/>
  </g>

  <!-- Moon -->
  <g transform="translate(660 110)">
    <circle r="34" fill="#F4F4F7"/>
    <circle r="34" cx="14" cy="-8" fill="#0C0A24"/>
  </g>

  <!-- City skyline -->
  <g fill="#0B0A1C">
    <rect x="20" y="250" width="90" height="170"/>
    <rect x="120" y="200" width="70" height="220"/>
    <rect x="200" y="285" width="60" height="135"/>
    <rect x="560" y="220" width="80" height="200"/>
    <rect x="650" y="270" width="60" height="150"/>
    <rect x="715" y="235" width="65" height="185"/>
  </g>
  <g fill="#00D9FF" opacity="0.75">
    <rect x="35" y="270" width="8" height="8"/><rect x="55" y="270" width="8" height="8"/><rect x="75" y="290" width="8" height="8"/>
    <rect x="135" y="220" width="8" height="8"/><rect x="155" y="220" width="8" height="8"/><rect x="135" y="250" width="8" height="8"/><rect x="170" y="260" width="8" height="8"/>
    <rect x="575" y="240" width="8" height="8"/><rect x="600" y="240" width="8" height="8"/><rect x="575" y="270" width="8" height="8"/>
    <rect x="730" y="255" width="8" height="8"/><rect x="755" y="255" width="8" height="8"/><rect x="730" y="285" width="8" height="8"/>
  </g>
  <g fill="#FF2DA6" opacity="0.7">
    <rect x="215" y="305" width="8" height="8"/><rect x="235" y="305" width="8" height="8"/>
    <rect x="665" y="290" width="8" height="8"/><rect x="685" y="310" width="8" height="8"/>
  </g>

  <!-- Street -->
  <rect x="0" y="415" width="800" height="185" fill="url(#street)"/>
  <g stroke="#8B3DFF" stroke-width="3" opacity="0.5" stroke-dasharray="26 22" stroke-linecap="round">
    <line x1="20" y1="560" x2="780" y2="560"/>
  </g>
  <line x1="0" y1="415" x2="800" y2="415" stroke="url(#neon)" stroke-width="2" opacity="0.6"/>

  <!-- Neon halo behind van -->
  <ellipse cx="400" cy="380" rx="230" ry="90" fill="url(#glow)" filter="url(#soft)"/>

  <!-- VAN -->
  <g transform="translate(210 250)">
    <!-- body -->
    <rect x="0" y="60" width="300" height="130" rx="16" fill="url(#van)" stroke="url(#neon)" stroke-width="3"/>
    <!-- cabin -->
    <path d="M300 90 L360 90 Q374 90 380 104 L392 150 Q394 190 380 190 L300 190 Z" fill="url(#van)" stroke="url(#neon)" stroke-width="3"/>
    <rect x="312" y="104" width="52" height="40" rx="6" fill="#0B1030" stroke="#00D9FF" stroke-width="2"/>
    <!-- serving window -->
    <rect x="24" y="86" width="150" height="66" rx="8" fill="#0B1030" stroke="#00D9FF" stroke-width="2"/>
    <rect x="24" y="150" width="150" height="10" fill="#FF7A18" opacity="0.85"/>
    <!-- sign -->
    <rect x="30" y="20" width="250" height="40" rx="10" fill="#0B0A1C" stroke="url(#neon)" stroke-width="3"/>
    <text x="155" y="49" text-anchor="middle" fill="#FFFFFF"
          font-family="'Bebas Neue',Oswald,sans-serif" font-size="30" letter-spacing="4">NIGHTBURGER</text>
    <!-- wheels -->
    <circle cx="70" cy="192" r="30" fill="#0A0A14" stroke="#8B3DFF" stroke-width="4"/>
    <circle cx="70" cy="192" r="10" fill="#1A1A2E"/>
    <circle cx="320" cy="192" r="30" fill="#0A0A14" stroke="#8B3DFF" stroke-width="4"/>
    <circle cx="320" cy="192" r="10" fill="#1A1A2E"/>
    <!-- headlight beam -->
    <path d="M392 150 L470 130 L470 180 L392 172 Z" fill="#FFE7A8" opacity="0.35"/>
  </g>

  <!-- Replaceable-asset marker -->
  <g opacity="0.7">
    <rect x="16" y="566" width="212" height="20" rx="6" fill="#03030A" stroke="#464655"/>
    <text x="24" y="580" fill="#858596" font-family="Inter,system-ui,sans-serif" font-size="10" letter-spacing="1.5">PLACEHOLDER · assets/images/hero/</text>
  </g>
</svg>
