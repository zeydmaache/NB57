<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Still Water photo placeholder">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#216CFF"/><stop offset="1" stop-color="#8B3DFF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#111122"/>
  <rect width="400" height="300" fill="url(#g)" opacity="0.07"/>
  <g filter="url(#glow)" fill="none" stroke="#216CFF" stroke-width="4" stroke-linecap="round">
    <path d="M158 132h84l-10 92a10 10 0 0 1-10 9h-44a10 10 0 0 1-10-9z"/>
    <line x1="152" y1="132" x2="248" y2="132"/>
    <line x1="214" y1="132" x2="232" y2="92"/>
  </g>
  <text x="200" y="244" text-anchor="middle" fill="#F4F4F7"
        font-family="'Bebas Neue',Oswald,sans-serif" font-size="22" letter-spacing="2">STILL WATER</text>
  <text x="200" y="264" text-anchor="middle" fill="#858596"
        font-family="Inter,system-ui,sans-serif" font-size="9" letter-spacing="2">PHOTO PLACEHOLDER</text>
</svg>
