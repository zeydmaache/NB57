<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Purple Haze photo placeholder">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D9FF"/><stop offset="1" stop-color="#8B3DFF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" fill="#111122"/>
  <rect width="400" height="300" fill="url(#g)" opacity="0.07"/>
  <g filter="url(#glow)" fill="none" stroke="#00D9FF" stroke-width="4" stroke-linecap="round">
    <path d="M120 150c0-26 36-44 80-44s80 18 80 44"/>
    <line x1="112" y1="168" x2="288" y2="168"/>
    <path d="M120 186c0 20 26 34 80 34s80-14 80-34"/>
    <circle cx="160" cy="150" r="4.5" fill="#00D9FF" stroke="none"/>
    <circle cx="200" cy="139" r="4.5" fill="#00D9FF" stroke="none"/>
    <circle cx="240" cy="150" r="4.5" fill="#00D9FF" stroke="none"/>
  </g>
  <text x="200" y="244" text-anchor="middle" fill="#F4F4F7"
        font-family="'Bebas Neue',Oswald,sans-serif" font-size="22" letter-spacing="2">PURPLE HAZE</text>
  <text x="200" y="264" text-anchor="middle" fill="#858596"
        font-family="Inter,system-ui,sans-serif" font-size="9" letter-spacing="2">PHOTO PLACEHOLDER</text>
</svg>
